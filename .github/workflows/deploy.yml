name: Deploy (manual)
# Never runs automatically. Trigger from the Actions tab after adding the repository secrets listed in DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        options: [worker-and-dashboard, worker, dashboard]
        default: worker-and-dashboard

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:free
      - run: npm test
      - if: inputs.target != 'dashboard'
        run: npm run deploy:worker
      - if: inputs.target != 'worker'
        run: npm run deploy:dashboard
