name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck (shared, worker, dashboard, extension)
        run: npm run typecheck
      - name: Tests (free-tier guard, shared, worker incl. PostgreSQL queue tests, Worker bundle build)
        run: npm test
      - name: Build dashboard
        run: npm run build:dashboard
        env: { VITE_API_BASE_URL: 'https://mailblaster-api.example.workers.dev' }
      - name: Build extension (placeholder URLs; configurable in the extension options)
        run: npm run build:extension
      - uses: actions/upload-artifact@v4
        with: { name: mailblaster-extension, path: extension/mailblaster-extension.zip }

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (dashboard + extension against the real Worker app on PostgreSQL, mock Gmail)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: /tmp/shots }
